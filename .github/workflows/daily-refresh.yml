name: Daily Corpus Refresh

on:
  schedule:
    - cron: '0 0 * * *'  # Runs at midnight UTC every day
  workflow_dispatch:      # Allows manual trigger from GitHub UI

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Edge Case 7.C.3: Grant write permissions to push to repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Data Pipeline
        run: python scripts/run_pipeline.py
        # Edge Case 7.C.1: The script automatically exits with non-zero on failure, halting the job.

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Add all tracked and untracked changes in data/ and scraper/ metadata
          git add data/
          git add scraper/source_metadata.json
          
          # Edge Case 7.C.2: Check if there are actual changes to commit
          if git diff --cached --quiet; then
            echo "No changes detected in source data. Skipping commit."
            exit 0
          fi
          
          git commit -m "chore(data): daily automated refresh of mutual fund data"
          git push
